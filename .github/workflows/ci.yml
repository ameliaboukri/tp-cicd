name: CI pipeline data

on:
  push:
  pull_request:
  workflow_dispatch:   # permet aussi de la lancer à la main depuis GitHub

jobs:
  pipeline:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: pipeline
      DB_PASSWORD: pipeline
      DB_NAME: transactions
      S3_ENDPOINT: http://localhost:8333
      S3_BUCKET: transactions
      OLLAMA_URL: http://localhost:11434
      REQUIRE_TESSERACT: "1"   # en CI, les tests OCR ne doivent jamais être sautés
      REQUIRE_SLM: "1"         # en CI, les tests SLM ne doivent jamais être sautés

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Tesseract (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          tesseract --version

      - name: Cache du modèle SLM (évite de re-télécharger 1 Go)
        uses: actions/cache@v4
        with:
          path: .ollama
          key: ollama-qwen2.5-1.5b

      - name: Démarrer le S3, PostgreSQL et Ollama
        run: docker compose up -d --wait

      - name: Télécharger le modèle SLM
        run: docker exec tp_ollama ollama pull qwen2.5:1.5b

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer les tests (unitaires + intégration + S3 + OCR + SLM)
        run: python -m pytest -v

      - name: Lancer la pipeline (CSV + images + textes -> S3 -> traitement -> base)
        run: python -m pipeline.main

      - name: Relancer la pipeline (vérifie l'anti-doublons)
        run: python -m pipeline.main

      - name: Vérifier les fichiers présents dans le S3
        run: curl -s "http://localhost:8333/transactions/?prefix=incoming/"

      - name: Démo retry insertion (2 pannes base simulées)
        run: python -m pipeline.main --data-dir data_retry_db --seed 7 --simulate-db-failures 2

      - name: Démo retry S3 (2 pannes de récupération simulées)
        run: python -m pipeline.main --data-dir data_retry_s3 --seed 8 --simulate-s3-failures 2

      - name: Logs des services en cas d'échec
        if: failure()
        run: docker compose logs --tail 50