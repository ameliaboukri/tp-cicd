services:
  postgres:
    image: postgres:17
    container_name: tp_postgres
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: transactions
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d transactions"]
      interval: 2s
      timeout: 3s
      retries: 15

  s3:
    image: chrislusf/seaweedfs
    container_name: tp_s3
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"   # port de l'API S3
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s